<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>premuim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff; --paper: #ffffff; --ink: #1b2a4a; --ink-soft: #5b6784; --line: #cdd5e3;
    --accent: #0e7c86; --accent-ink: #ffffff; --unlocked: #e0a526; --danger: #c0392b; --radius: 4px;
  }
  /* 手動切換黑底時的變數 */
  body.dark-mode {
    --bg: #0f1626; --paper: #18223a; --ink: #e7ecf7; --ink-soft: #94a0bd; --line: #2c3856;
    --accent: #3bb6c1; --accent-ink: #08202a; --unlocked: #f0b93a; --danger: #ef7567;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Noto Sans TC", system-ui, sans-serif; background: var(--bg); color: var(--ink);
    line-height: 1.6; min-height: 100vh; transition: background-color 0.2s, color 0.2s;
  }
  h1, h2 { font-family: "Noto Serif TC", serif; margin: 0; }
  button { font: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ---------- 登入畫面 ---------- */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .login-card {
    background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 40px 32px; width: min(420px, 100%); text-align: center;
  }
  .login-card h1 { font-size: 2rem; font-weight: 900; margin-bottom: 8px; }
  .login-card p { color: var(--ink-soft); margin: 0 0 28px; }

  /* ---------- 按鈕 ---------- */
  .btn {
    border: 1px solid var(--ink); background: transparent; color: var(--ink);
    padding: 8px 16px; border-radius: var(--radius); font-weight: 500;
  }
  .btn:hover { background: var(--ink); color: var(--bg); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.08); background: var(--accent); color: var(--accent-ink); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ---------- 頂部列 ---------- */
  header.bar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    padding: 12px 24px; background: var(--paper); border-bottom: 1px solid var(--line);
  }
  .brand { font-family: "Noto Serif TC", serif; font-weight: 900; font-size: 1.25rem; }
  .account { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .who { text-align: right; line-height: 1.3; }
  .who strong { display: block; font-size: .95rem; }
  .who span { font-size: .8rem; color: var(--ink-soft); }
  .points { display: flex; align-items: baseline; gap: 6px; border: 2px solid var(--unlocked); border-radius: var(--radius); padding: 2px 12px; }
  .points b { font-family: "Noto Serif TC", serif; font-size: 1.5rem; }
  .points small { color: var(--ink-soft); }

  /* ---------- 主內容 ---------- */
  main { max-width: 960px; margin: 0 auto; padding: 24px; }
  .redeem {
    background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 32px;
  }
  .redeem label { font-weight: 700; }
  .redeem input {
    flex: 1 1 200px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--bg); color: var(--ink); font: inherit; letter-spacing: .05em;
  }

  /* ---------- 搜尋與篩選 ---------- */
  .search { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .search input, .search select {
    padding: 9px 12px; border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--paper); color: var(--ink); font: inherit;
  }
  .search input { flex: 1 1 260px; }
  .result-info { color: var(--ink-soft); font-size: .9rem; margin: 0 0 24px; min-height: 1.4em; }
  .q .title { display: block; font-size: .85rem; color: var(--ink-soft); margin-bottom: 2px; }
  .subject { margin-bottom: 36px; }
  .subject h2 {
    font-size: 1.4rem; padding-bottom: 8px; margin-bottom: 16px; border-bottom: 3px solid var(--ink);
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .subject h2 small { font-family: "Noto Sans TC", sans-serif; font-weight: 400; font-size: .85rem; color: var(--ink-soft); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .q {
    position: relative; padding: 14px 12px 12px; text-align: left; background: var(--paper); color: var(--ink);
    border: 1px solid var(--line); border-left: 5px solid var(--line); border-radius: var(--radius);
    transition: border-color .15s, transform .15s;
  }
  .q:hover { border-color: var(--accent); border-left-color: var(--accent); transform: translateY(-2px); }
  .q .no { display: block; font-family: "Noto Serif TC", serif; font-weight: 600; font-size: 1.1rem; }
  .q .state { font-size: .8rem; color: var(--ink-soft); }
  .q.owned { border-left-color: var(--unlocked); }
  .q.owned .state { color: var(--unlocked); font-weight: 700; }
  .empty { color: var(--ink-soft); }

  /* ---------- Modal ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(10, 16, 30, .4);
    display: grid; place-items: center; padding: 24px; z-index: 50;
  }
  .modal {
    background: var(--paper); color: var(--ink); border-radius: var(--radius);
    padding: 28px; width: min(400px, 100%); border-top: 6px solid var(--accent);
  }
  .modal h2 { font-size: 1.3rem; margin-bottom: 8px; }
  .modal p { margin: 0 0 16px; color: var(--ink-soft); }
  .modal input {
    width: 100%; padding: 10px 12px; margin-bottom: 8px; font: inherit;
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); color: var(--ink);
  }
  .modal .err { color: var(--danger); min-height: 1.5em; font-size: .9rem; margin: 0 0 8px; }
  .modal .actions { display: flex; justify-content: flex-end; gap: 10px; }

  /* ---------- 答案彈窗（可選取、可複製） ---------- */
  .answer-modal { width: min(720px, 100%); }
  .answer-modal pre {
    margin: 0 0 16px; padding: 14px; max-height: 60vh; overflow: auto;
    white-space: pre-wrap; overflow-wrap: anywhere;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Noto Sans TC", monospace;
    font-size: .95rem; line-height: 1.6;
    background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius);
    user-select: text; -webkit-user-select: text; cursor: text;
  }

  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 10px 20px; border-radius: var(--radius);
    z-index: 60; max-width: calc(100% - 32px);
  }
  @media (prefers-reduced-motion: reduce) { .q { transition: none; } .q:hover { transform: none; } }
  @media (max-width: 560px) { header.bar { padding: 10px 14px; } main { padding: 16px; } .who { text-align: left; } }
</style>
</head>
<body>

<!-- 登入畫面 -->
<section id="login" class="login" hidden>
  <div class="login-card">
    <h1>premuim</h1>
    <button id="btnLogin" class="btn primary">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.19v3.15C3.17 21.36 7.23 24 12 24z"/>
        <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.5-.38-2.24s.13-1.52.38-2.24V6.61H1.19C.43 8.14 0 9.87 0 12s.43 3.86 1.19 5.39l4.08-3.15z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.17 2.64 1.19 6.61l4.08 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/>
      </svg>
      Continue with Google
    </button>
  </div>
</section>

<!-- 主畫面（通過登入與通行碼後才顯示） -->
<div id="app" hidden>
  <header class="bar">
    <div class="brand">premuim</div>
    <div class="account">
      <button id="btnTheme" class="btn">黑/白</button>
      <div class="who"><strong id="uName"></strong><span id="uEmail"></span></div>
      <div class="points" aria-live="polite"><small>剩餘</small><b id="uPoints">0</b><small>點</small></div>
      <button id="btnLogout" class="btn">登出</button>
    </div>
  </header>
  <main>
    <form id="redeemForm" class="redeem">
      <label for="redeemInput">兌換序號</label>
      <input id="redeemInput" autocomplete="off" placeholder="請輸入序號">
      <button class="btn primary" type="submit" id="btnRedeem">兌換</button>
    </form>
    <div class="search">
      <input id="searchInput" type="search" autocomplete="off"
             placeholder="搜尋題目：科目、題號、標題或關鍵字（可用空白分隔多個詞）" aria-label="搜尋題目">
      <select id="subjectFilter" aria-label="依科目篩選"></select>
      <select id="statusFilter" aria-label="依狀態篩選">
        <option value="all">全部狀態</option>
        <option value="owned">已解鎖</option>
        <option value="locked">未解鎖</option>
      </select>
    </div>
    <p id="resultInfo" class="result-info" aria-live="polite"></p>
    <div id="subjects"></div>
  </main>
</div>

<!-- 共用彈窗 -->
<div id="overlay" class="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle"></h2>
    <p id="mText"></p>
    <input id="mInput" hidden autocomplete="off">
    <p id="mErr" class="err" role="alert"></p>
    <div class="actions">
      <button id="mCancel" class="btn">取消</button>
      <button id="mOk" class="btn primary">確認</button>
    </div>
  </div>
</div>

<!-- 答案彈窗 -->
<div id="answerOverlay" class="overlay" hidden>
  <div class="modal answer-modal" role="dialog" aria-modal="true" aria-labelledby="aTitle">
    <h2 id="aTitle"></h2>
    <pre id="aBody" tabindex="0"></pre>
    <div class="actions">
      <button id="aCopy" class="btn">複製答案</button>
      <button id="aClose" class="btn primary">關閉</button>
    </div>
  </div>
</div>
<div id="toast" hidden></div>

<script type="module">
/* ===================== 開發者設定區 ===================== */
const firebaseConfig = {
  apiKey: "AIzaSyBsx2-oJT5K-DwBnFMskjSguWSTtOdvvyc",
  authDomain: "premuim-37b50.firebaseapp.com",
  projectId: "premuim-37b50",
  storageBucket: "premuim-37b50.firebasestorage.app",
  messagingSenderId: "888346833463",
  appId: "1:888346833463:web:8c30dd7cdc53aa560ac5b2"
};

const CATALOG = [
  {
    id: "class", name: "課堂",
    questions: [
      { no: 104, title: "讓電腦說哈囉" },
      { no: 115, title: "59 分自動加 1 分" },
      { no: 140, title: "佛系老師自動加分機" },
      { no: 116, title: "p1-27 三數之最大數" },
      { no: 142, title: "五整數之最小者" }
    ]
  },
  {
    id: "add", name: "加分題",
    questions: [
      { no: 112, title: "計算加權總分和加權平均" },
      { no: 134, title: "[延伸活動] 輸入 5 科之測驗成績，輸出總分與平均" },
      { no: 135, title: "[應用題5] 購物折扣" }
    ]
  },
  {
    id: "zerojudge", name: "zerojudge",
    questions: [
      { no: "a001", title: "哈囉" },
      { no: "a002", title: "簡易加法" },
      { no: "c726", title: "K-I-S-S-I-N-G (一行版)" },
      { no: "d049", title: "中華民國萬歲！" },
      { no: "d063", title: "0 與 1" },
      { no: "e926", title: "跳脫字元" }
    ]
  }
];

const COST_PER_QUESTION = 10;
const WELCOME_POINTS = 10;
const ANSWER_SOURCE = "firestore";

/* ===================== Firebase 初始化 ===================== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, runTransaction, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ===================== 小工具 ===================== */
const $ = (id) => document.getElementById(id);
let unsubUser = null;
let userData = null;
let busy = false;

function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => (t.hidden = true), 2600);
}

// 切換黑白背景
$("btnTheme").onclick = () => { document.body.classList.toggle("dark-mode"); };

function openModal({ title, text, okText = "確認", cancelText = "取消", input = false, cancelable = true, onSubmit }) {
  return new Promise((resolve) => {
    $("mTitle").textContent = title;
    $("mText").textContent = text;
    $("mOk").textContent = okText;
    $("mCancel").textContent = cancelText;
    $("mCancel").hidden = !cancelable;
    $("mErr").textContent = "";
    const inp = $("mInput");
    inp.hidden = !input; inp.value = "";
    $("overlay").hidden = false;
    (input ? inp : $("mOk")).focus();

    const close = (val) => {
      $("overlay").hidden = true;
      $("mOk").onclick = $("mCancel").onclick = inp.onkeydown = null;
      resolve(val);
    };
    const submit = async () => {
      $("mOk").disabled = true;
      const err = onSubmit ? await onSubmit(inp.value) : null;
      $("mOk").disabled = false;
      if (err) { $("mErr").textContent = err; return; }
      close(input ? inp.value : true);
    };
    $("mOk").onclick = submit;
    $("mCancel").onclick = () => close(null);
    inp.onkeydown = (e) => { if (e.key === "Enter") submit(); };
  });
}

function showScreen(name) {
  $("login").hidden = name !== "login";
  $("app").hidden = name !== "app";
}

/* ===================== 登入 / 登出 ===================== */
$("btnLogin").onclick = async () => {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) { if (e.code !== "auth/popup-closed-by-user") toast("登入失敗：" + e.code); }
};
$("btnLogout").onclick = () => signOut(auth);

onAuthStateChanged(auth, async (user) => {
  if (unsubUser) { unsubUser(); unsubUser = null; }
  userData = null;
  if (!user) { showScreen("login"); return; }

  showScreen("none");
  const ok = await askPasscode(user);
  if (!ok) { await signOut(auth); return; }
  await ensureUserDoc(user);

  $("uName").textContent = user.displayName || "（未命名）";
  $("uEmail").textContent = user.email || "";
  unsubUser = onSnapshot(doc(db, "users", user.uid), (snap) => {
    userData = snap.data();
    $("uPoints").textContent = userData?.points ?? 0;
    renderSubjects();
  });
  showScreen("app");
});

/* ===================== 通行碼驗證 ===================== */
async function askPasscode(user) {
  const result = await openModal({
    title: "請輸入通行碼",
    text: "請輸入通行碼以進入網站。",
    okText: "驗證",
    cancelText: "登出",
    input: true,
    onSubmit: async (value) => {
      const code = value.trim();
      if (!code) return "請輸入通行碼";
      try {
        await setDoc(doc(db, "passcode_checks", user.uid), { code, at: serverTimestamp() });
        return null;
      } catch (e) {
        return e.code === "permission-denied" ? "通行碼錯誤，請再試一次" : "驗證失敗：" + e.code;
      }
    }
  });
  return result !== null;
}

async function ensureUserDoc(user) {
  const ref = doc(db, "users", user.uid);
  const snap = await getDoc(ref);
  if (snap.exists()) return;
  await setDoc(ref, {
    email: user.email || "",
    displayName: user.displayName || "",
    points: WELCOME_POINTS,
    purchased: [],
    createdAt: serverTimestamp()
  });
  toast(`歡迎！已發放 ${WELCOME_POINTS} 點`);
}

/* ===================== 依 CATALOG 渲染 ===================== */
const keyOf = (subject, q) => `${subject.id}-${q.no}`;
const filter = { text: "", subject: "all", status: "all" };

function initFilters() {
  const sel = $("subjectFilter");
  sel.innerHTML = `<option value="all">全部科目</option>` +
    CATALOG.map((sub) => `<option value="${sub.id}">${sub.name}</option>`).join("");

  const input = $("searchInput");
  const apply = () => { filter.text = input.value; renderSubjects(); };
  input.addEventListener("input", (e) => { if (!e.isComposing) apply(); });
  input.addEventListener("compositionend", apply);
  sel.onchange = () => { filter.subject = sel.value; renderSubjects(); };
  $("statusFilter").onchange = (e) => { filter.status = e.target.value; renderSubjects(); };
}

// 純數字視為題號（精確比對）；其他文字比對科目、題號（含 a001 這類）、標題、關鍵字
function matchesText(subject, q) {
  const terms = filter.text.toLowerCase().split(/\s+/).filter(Boolean);
  if (!terms.length) return true;
  const hay = [subject.name, subject.id, String(q.no), q.title || "", ...(q.keywords || [])].join(" ").toLowerCase();
  return terms.every((t) => {
    const term = t.replace(/[第題题號号]/g, "");
    if (!term) return true;
    if (/^\d+$/.test(term)) return String(q.no) === term;
    return hay.includes(term);
  });
}

function renderSubjects() {
  const owned = new Set(userData?.purchased || []);
  const root = $("subjects");
  root.innerHTML = "";
  let shown = 0;

  CATALOG.forEach((subject) => {
    if (filter.subject !== "all" && filter.subject !== subject.id) return;
    const ownedCount = subject.questions.filter((q) => owned.has(keyOf(subject, q))).length;
    const list = subject.questions.filter((q) => {
      const isOwned = owned.has(keyOf(subject, q));
      if (filter.status === "owned" && !isOwned) return false;
      if (filter.status === "locked" && isOwned) return false;
      return matchesText(subject, q);
    });
    if (!list.length) return;
    shown += list.length;

    const sec = document.createElement("section");
    sec.className = "subject";
    sec.innerHTML = `<h2>${subject.name}<small>已解鎖 ${ownedCount} / ${subject.questions.length}</small></h2>`;
    const grid = document.createElement("div");
    grid.className = "grid";
    list.forEach((q) => {
      const isOwned = owned.has(keyOf(subject, q));
      const btn = document.createElement("button");
      btn.className = "q" + (isOwned ? " owned" : "");
      const titleHtml = q.title ? `<span class="title"></span>` : "";
      btn.innerHTML = `<span class="no">第 ${q.no} 題</span>${titleHtml}<span class="state">${isOwned ? "已解鎖・點擊查看" : COST_PER_QUESTION + " 點解鎖"}</span>`;
      if (q.title) btn.querySelector(".title").textContent = q.title;
      btn.onclick = () => onQuestionClick(subject, q);
      grid.appendChild(btn);
    });
    sec.appendChild(grid);
    root.appendChild(sec);
  });

  const filtering = filter.text.trim() || filter.subject !== "all" || filter.status !== "all";
  if (!shown) root.innerHTML = `<p class="empty">找不到符合的題目，請換個關鍵字，或把篩選條件改回「全部」。</p>`;
  $("resultInfo").textContent = filtering ? `找到 ${shown} 題` : "";
}

initFilters();

/* ===================== 答案讀取與顯示 ===================== */
async function getAnswer(subject, q, key) {
  if (ANSWER_SOURCE === "firestore") {
    try {
      const snap = await getDoc(doc(db, "answers", key));
      if (!snap.exists()) return { error: `Firestore 找不到文件 answers/${key}（文件 ID 要和題目鍵完全一致）` };
      const a = snap.data().answer;
      if (typeof a !== "string" || !a) return { error: `answers/${key} 沒有 answer 欄位，或它不是 string` };
      return { answer: a };
    } catch (e) {
      console.error("讀取答案失敗：", key, e);
      return { error: e.code === "permission-denied"
        ? "權限不足：Rules 還沒加入 answers 區塊，或此題不在你的購買紀錄中"
        : (e.code || e.message) };
    }
  }
  return q.answer ? { answer: q.answer } : { error: `ANSWER_SOURCE 是 "config"，但 CATALOG 這一題沒有 answer 欄位` };
}

// 複製：優先用 Clipboard API，失敗時退回舊方法
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  ta.remove();
  return ok;
}

// 答案彈窗：用 textContent 顯示，答案裡的 < > & 不會被當成 HTML
function openAnswerModal(title, text, copyable) {
  return new Promise((resolve) => {
    $("aTitle").textContent = title;
    $("aBody").textContent = text;
    $("aCopy").hidden = !copyable;
    $("aCopy").textContent = "複製答案";
    $("answerOverlay").hidden = false;
    $("aBody").scrollTop = 0;
    $("aBody").focus();

    const close = () => {
      $("answerOverlay").hidden = true;
      document.removeEventListener("keydown", onKey);
      $("answerOverlay").onclick = $("aClose").onclick = $("aCopy").onclick = null;
      resolve();
    };
    const onKey = (e) => { if (e.key === "Escape") close(); };
    document.addEventListener("keydown", onKey);
    $("aClose").onclick = close;
    $("answerOverlay").onclick = (e) => { if (e.target === $("answerOverlay")) close(); };
    $("aCopy").onclick = async () => {
      const ok = await copyText(text);
      $("aCopy").textContent = ok ? "已複製 ✓" : "複製失敗，請手動選取";
    };
  });
}

async function showAnswer(subject, q, key) {
  const r = await getAnswer(subject, q, key);
  if (r.answer) await openAnswerModal(`${subject.name} 第 ${q.no} 題 答案`, r.answer, true);
  else await openAnswerModal("找不到答案", `原因：${r.error}\n題目鍵：${key}\n\n請聯絡管理員`, false);
}

/* ===================== 點擊題目 ===================== */
async function onQuestionClick(subject, q) {
  if (busy || !userData) return;
  const key = keyOf(subject, q);

  if ((userData.purchased || []).includes(key)) {
    await showAnswer(subject, q, key);
    return;
  }
  if (userData.points < COST_PER_QUESTION) {
    toast(`點數不足，需要 ${COST_PER_QUESTION} 點，可使用序號兌換`);
    return;
  }

  const ok = await openModal({
    title: "確認解鎖",
    text: `解鎖「${subject.name} 第 ${q.no} 題」將消耗 ${COST_PER_QUESTION} 點，目前剩餘 ${userData.points} 點。`,
    okText: `消耗 ${COST_PER_QUESTION} 點`
  });
  if (!ok) return;

  busy = true;
  try {
    const ref = doc(db, "users", auth.currentUser.uid);
    await runTransaction(db, async (tx) => {
      const snap = await tx.get(ref);
      const d = snap.data();
      if (d.purchased.includes(key)) return;
      if (d.points < COST_PER_QUESTION) throw new Error("NO_POINTS");
      tx.update(ref, { points: d.points - COST_PER_QUESTION, purchased: [...d.purchased, key] });
    });
    toast("解鎖成功");
    busy = false;
    await showAnswer(subject, q, key);
  } catch (e) {
    toast(e.message === "NO_POINTS" ? "點數不足" : "解鎖失敗：" + (e.code || e.message));
  } finally {
    busy = false;
  }
}

/* ===================== 兌換序號 ===================== */
$("redeemForm").onsubmit = async (e) => {
  e.preventDefault();
  if (busy) return;
  const code = $("redeemInput").value.trim().toUpperCase();
  if (!code || code.includes("/")) { toast("請輸入有效的序號"); return; }

  busy = true; $("btnRedeem").disabled = true;
  const uid = auth.currentUser.uid;
  try {
    const gained = await runTransaction(db, async (tx) => {
      const codeRef = doc(db, "redemption_codes", code);
      const userRef = doc(db, "users", uid);
      const [codeSnap, userSnap] = await Promise.all([tx.get(codeRef), tx.get(userRef)]);
      if (!codeSnap.exists()) throw new Error("NOT_FOUND");
      if (codeSnap.data().used) throw new Error("USED");
      const pts = codeSnap.data().points;
      tx.update(codeRef, { used: true, usedBy: uid, usedAt: serverTimestamp() });
      tx.update(userRef, { points: userSnap.data().points + pts, lastRedeemCode: code });
      return pts;
    });
    $("redeemInput").value = "";
    toast(`兌換成功，獲得 ${gained} 點`);
  } catch (err) {
    const map = { NOT_FOUND: "序號不存在", USED: "此序號已被使用" };
    toast(map[err.message] || (err.code === "permission-denied" ? "序號無效或已被使用" : "兌換失敗：" + (err.code || err.message)));
  } finally {
    busy = false; $("btnRedeem").disabled = false;
  }
};
